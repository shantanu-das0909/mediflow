spring.application.name=appointment-service
# Port 8081
server.port=${APPLICATION_SERVICE_PORT}

## Postgres
spring.datasource.url=jdbc:postgresql://localhost:5432/${APPLICATION_SERVICE_DB_NAME}
spring.datasource.username=${APPLICATION_SERVICE_DB_USERNAME}
spring.datasource.password=${APPLICATION_SERVICE_DB_PASSWORD}

spring.jpa.database-platform=org.hibernate.dialect.PostgresPlusDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true